<div class="controls" id="controls">
  <input type="search" id="search" placeholder="Search title, author, tag…" autocomplete="off" aria-label="Search">
  <div class="filters">
    <div class="multiselect">
      <button type="button" class="multiselect-btn" id="tag-btn" aria-expanded="false" aria-controls="tag-menu"><span id="tag-btn-label">Tags</span><span class="multiselect-arrow" aria-hidden="true">▾</span></button>
      <fieldset class="multiselect-menu" id="tag-menu" hidden>
        <legend class="visually-hidden">Filter by tag</legend>
        {tag_checkboxes}
      </fieldset>
    </div>
    <select id="tag-mode" aria-label="Tag match mode">
      <option value="any">Any of</option>
      <option value="all">All of</option>
      <option value="none">None of</option>
    </select>
    <select id="sort" aria-label="Sort by">
      <option value="finished">Recently finished</option>
      <option value="started">Recently started</option>
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="stars">Rating</option>
    </select>
  </div>
</div>
